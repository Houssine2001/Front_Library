<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let author"> {{author.id}} </td>
    </ng-container>
  
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nom </th>
      <td mat-cell *matCellDef="let author"> {{author.name}} </td>
    </ng-container>
  
    <ng-container matColumnDef="biography">
      <th mat-header-cell *matHeaderCellDef> Biographie </th>
      <td mat-cell *matCellDef="let author"> {{author.biography}} </td>
    </ng-container>
  
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let author">
        <button mat-button color="primary" [routerLink]="['/edit', author.id]">Modifier</button>
        <button mat-button color="warn" (click)="deleteAuthor(author.id)">Supprimer</button>
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
