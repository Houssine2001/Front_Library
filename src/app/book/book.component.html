<div class="container">
    <h2>Books</h2>
  
    <!-- Formulaire d'ajout -->
    <mat-card class="add-book-card">
      <mat-card-title>Add New Book</mat-card-title>
      <mat-card-content>
        <form (ngSubmit)="addBook()">
          <mat-form-field appearance="fill">
            <mat-label>Title</mat-label>
            <input matInput [(ngModel)]="newBook.title" name="title" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Author</mat-label>
            <input matInput [(ngModel)]="newBook.author" name="author" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Genre</mat-label>
            <input matInput [(ngModel)]="newBook.genre" name="genre" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>ISBN</mat-label>
            <input matInput [(ngModel)]="newBook.isbn" name="isbn" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Description</mat-label>
            <textarea matInput [(ngModel)]="newBook.description" name="description"></textarea>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Price</mat-label>
            <input matInput type="number" [(ngModel)]="newBook.price" name="price" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Quantity</mat-label>
            <input matInput type="number" [(ngModel)]="newBook.quantity" name="quantity" required>
          </mat-form-field>
          <button mat-raised-button color="primary" type="submit">Add Book</button>
        </form>
      </mat-card-content>
    </mat-card>
  
    <!-- Filtres et tri -->
    <div class="filters">
      <mat-form-field appearance="fill">
        <mat-label>Sort by Price</mat-label>
        <mat-select [(ngModel)]="sortDirection" (selectionChange)="applySortAndFilter()">
          <mat-option value="asc">Ascending</mat-option>
          <mat-option value="desc">Descending</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Min Price</mat-label>
        <input matInput type="number" [(ngModel)]="minPrice" (keyup.enter)="applySortAndFilter()">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Max Price</mat-label>
        <input matInput type="number" [(ngModel)]="maxPrice" (keyup.enter)="applySortAndFilter()">
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="applySortAndFilter()">Apply</button>
    </div>
  
    <!-- Liste des livres -->
    <table mat-table [dataSource]="books">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let book">{{book.title}}</td>
      </ng-container>
      <ng-container matColumnDef="author">
        <th mat-header-cell *matHeaderCellDef>Author</th>
        <td mat-cell *matCellDef="let book">{{book.author}}</td>
      </ng-container>
      <ng-container matColumnDef="genre">
        <th mat-header-cell *matHeaderCellDef>Genre</th>
        <td mat-cell *matCellDef="let book">{{book.genre}}</td>
      </ng-container>
      <ng-container matColumnDef="isbn">
        <th mat-header-cell *matHeaderCellDef>ISBN</th>
        <td mat-cell *matCellDef="let book">{{book.isbn}}</td>
      </ng-container>
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Price</th>
        <td mat-cell *matCellDef="let book">{{book.price}}</td>
      </ng-container>
      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef>Quantity</th>
        <td mat-cell *matCellDef="let book">{{book.quantity}}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let book">
          <button mat-button (click)="editBook(book.id)">Edit</button>
          <button mat-button color="warn" (click)="deleteBook(book.id)">Delete</button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
