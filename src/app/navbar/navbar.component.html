<header class="site-header">
  <div class="container">
    <div class="navbar">
      <div class="logo">
        <a routerLink="/">
          <span class="logo-text">Book<span class="highlight">Haven</span></span>
        </a>
      </div>
      
      <nav class="main-nav">
        <ul class="nav-links">
          <li><a routerLink="/ListAuthors" routerLinkActive="active">Gestion des Auteurs</a></li>
          <li><a routerLink="/books" routerLinkActive="active">Explore Books</a></li>
          <li>
            <a routerLink="/cart" routerLinkActive="active">
              <div class="cart-link">
                <span>My Cart</span>
                <div class="cart-icon">
                  <i class="fas fa-shopping-cart"></i>
                </div>
              </div>
            </a>
          </li>
        </ul>
      </nav>
      
      <div class="mobile-menu-toggle" [class.active]="mobileMenuOpen">
        <button (click)="toggleMobileMenu()" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
    
    <div class="mobile-menu" [class.active]="mobileMenuOpen">
      <ul class="mobile-nav-links">
        <li><a routerLink="/ListAuthors" routerLinkActive="active" (click)="closeMobileMenu()">Gestion des Auteurs</a></li>
        <li><a routerLink="/books" routerLinkActive="active" (click)="closeMobileMenu()">Explore Books</a></li>
        <li><a routerLink="/cart" routerLinkActive="active" (click)="closeMobileMenu()">My Cart</a></li>
      </ul>
    </div>
  </div>
</header>
