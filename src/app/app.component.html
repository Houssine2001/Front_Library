    <!-- Afficher ces éléments uniquement sur la route /ListAuthors -->

      <!-- Bouton flottant pour ajouter un auteur -->

      <!-- Ajouter le composant d'import/export ici -->
      <app-author-import-export></app-author-import-export>

    <router-outlet></router-outlet>
  </div>
</main>
