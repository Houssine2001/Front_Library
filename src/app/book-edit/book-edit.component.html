<div class="container">
    <mat-card>
      <mat-card-title>Edit Book</mat-card-title>
      <mat-card-content>
        <form (ngSubmit)="updateBook()">
          <mat-form-field appearance="fill">
            <mat-label>Title</mat-label>
            <input matInput [(ngModel)]="book.title" name="title" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Author</mat-label>
            <input matInput [(ngModel)]="book.author" name="author" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Genre</mat-label>
            <input matInput [(ngModel)]="book.genre" name="genre" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>ISBN</mat-label>
            <input matInput [(ngModel)]="book.isbn" name="isbn" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Description</mat-label>
            <textarea matInput [(ngModel)]="book.description" name="description"></textarea>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Price</mat-label>
            <input matInput type="number" [(ngModel)]="book.price" name="price" required>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Quantity</mat-label>
            <input matInput type="number" [(ngModel)]="book.quantity" name="quantity" required>
          </mat-form-field>
          <button mat-raised-button color="primary" type="submit">Update</button>
          <button mat-button [routerLink]="['/books']">Cancel</button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
